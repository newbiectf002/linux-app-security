services:
  research:
    build:
      context: .
      dockerfile: Dockerfile
      # WSL Docker bridge/NAT may establish TCP but stall on repository traffic.
      # Host networking is limited to image build; the service keeps its normal
      # isolated Compose network at runtime.
      network: host
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /tmp/research-home
      WORKSPACE: ${WORKSPACE:-/workspace}
      OUTPUT_DIR: ${OUTPUT_DIR:-/workspace/output}
      CACHE_DIR: ${CACHE_DIR:-/workspace/cache}
      TMP_DIR: ${TMP_DIR:-/workspace/tmp}
      MAX_SCAN_THREADS: ${MAX_SCAN_THREADS:-4}
      MAX_EXTRACTION_DEPTH: ${MAX_EXTRACTION_DEPTH:-5}
    volumes:
      - .:/workspace
      - ./cache:/workspace/cache
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    stdin_open: true
    tty: true

  codex:
    profiles: ["codex"]
    image: linux-app-security-codex:local
    build:
      context: .
      dockerfile: Dockerfile.codex
      network: host
    volumes:
      - .:/workspace
      - ./cache:/workspace/cache
      - codex-home:/root/.codex
    working_dir: /workspace
    stdin_open: true
    tty: true

  cwe-checker:
    profiles: ["cwe-checker"]
    image: ghcr.io/fkie-cad/cwe_checker:stable
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: ["/home/cwe/cwe_checker"]

volumes:
  codex-home:
